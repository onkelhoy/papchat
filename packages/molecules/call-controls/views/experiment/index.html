<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pc-call-controls | experiment</title>
    <link rel="stylesheet" href="style.css" />
    <script defer type="module" src="main.js"></script>
</head>

<body>
    <h1>pc-call-controls</h1>

    <section>
        <h2>Default (all off) and interactive</h2>
        <pap-codeblock display="both">
            <div class="row">
                <pc-call-controls id="main"></pc-call-controls>
                <pre id="log">events show here</pre>
            </div>
        </pap-codeblock>
    </section>

    <section>
        <h2>Mic and camera on</h2>
        <pap-codeblock display="both">
            <div class="row">
                <pc-call-controls mic camera></pc-call-controls>
            </div>
        </pap-codeblock>
    </section>

    <section>
        <h2>Sharing screen</h2>
        <pap-codeblock display="both">
            <div class="row">
                <pc-call-controls mic camera screen></pc-call-controls>
            </div>
        </pap-codeblock>
    </section>

    <section>
        <h2>No screen sharing support (canscreen="false")</h2>
        <pap-codeblock display="both">
            <div class="row">
                <pc-call-controls mic canscreen="false"></pc-call-controls>
            </div>
        </pap-codeblock>
    </section>

    <section>
        <h2>Viewer</h2>
        <pap-codeblock display="both">
            <div class="row">
                <pc-call-controls viewer></pc-call-controls>
                <pc-call-controls viewer chat></pc-call-controls>
            </div>
        </pap-codeblock>
    </section>

    <section>
        <h2>createElement</h2>
        <pap-codeblock display="both">
            <div class="row" id="created"></div>
        </pap-codeblock>
    </section>
</body>

</html>
