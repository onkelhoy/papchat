<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RingtonePicker | experiment</title>

    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <!-- Styles -->
    <link rel="stylesheet" href="style.css" />

    <script defer type="module" src="main.js"></script>
</head>

<body>
    <h1>pc-ringtone-picker</h1>
    <p>The component never plays audio: <code>preview</code> sets <code>playing</code> here (auto-stops after 2 s), <code>preview-stop</code> clears it.</p>
    <p id="log">events show here</p>

    <section>
        <h2>Default (3 tones, second selected, volume 60%)</h2>
        <pc-ringtone-picker id="main"></pc-ringtone-picker>
    </section>

    <section>
        <h2>No selection, full volume, one tone</h2>
        <pc-ringtone-picker id="single"></pc-ringtone-picker>
    </section>

    <section>
        <h2>Empty list</h2>
        <pc-ringtone-picker id="empty" volume="0.3"></pc-ringtone-picker>
    </section>

    <section data-theme="dark">
        <h2>Dark theme</h2>
        <pc-ringtone-picker id="dark"></pc-ringtone-picker>
    </section>

    <section>
        <h2>Created with document.createElement</h2>
        <div id="created"></div>
    </section>
</body>

</html>
