<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pc-language-picker | experiment</title>
    <link rel="stylesheet" href="style.css" />
    <script defer type="module" src="main.js"></script>
</head>

<body>
    <h1>pc-language-picker</h1>

    <section>
        <h2>Default (en, sv)</h2>
        <pap-codeblock display="both">
            <div class="row">
                <pc-language-picker></pc-language-picker>
                <pc-language-picker value="sv"></pc-language-picker>
                <span id="log">change events show here</span>
            </div>
        </pap-codeblock>
    </section>

    <section>
        <h2>Custom languages</h2>
        <pap-codeblock display="both">
            <div class="row">
                <pc-language-picker id="custom"></pc-language-picker>
            </div>
        </pap-codeblock>
    </section>

    <section>
        <h2>createElement</h2>
        <pap-codeblock display="both">
            <div class="row" id="created"></div>
        </pap-codeblock>
    </section>
</body>

</html>
