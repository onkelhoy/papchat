<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareLink | experiment</title>

    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <!-- Styles -->
    <link rel="stylesheet" href="style.css" />

    <script defer type="module" src="main.js"></script>
</head>

<body>
    <h1>pc-share-link</h1>
    <section>
        <h2>Default</h2>
        <pap-codeblock display="both">
            <pc-share-link link="https://example.com/papchat/#join=team&key=demo"></pc-share-link>
    
        </pap-codeblock></section>
    <section>
        <h2>Compact</h2>
        <pap-codeblock display="both">
            <pc-share-link compact link="https://example.com/papchat/#join=team&key=demo"></pc-share-link>
    
        </pap-codeblock></section>
    <section data-theme="dark">
        <h2>Dark</h2>
        <pap-codeblock display="both">
            <pc-share-link link="https://example.com/papchat/#join=team&key=demo"></pc-share-link>
            <pc-share-link compact link="https://example.com/papchat/#join=team&key=demo"></pc-share-link>
    
        </pap-codeblock></section>
    <section id="created">
        <h2>More examples</h2>
        <pap-codeblock display="both">
    
        </pap-codeblock></section>
</body>

</html>
