<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pc-stage-card | experiment</title>
    <link rel="stylesheet" href="style.css" />
    <script defer type="module" src="main.js"></script>
</head>

<body>
    <h1>pc-stage-card</h1>
    <p id="log" class="hint">watch events show here</p>

    <section>
        <h2>Watching, mine, long title, zero viewers</h2>
        <pap-codeblock display="both">
            <div class="list" id="states"></div>
        </pap-codeblock>
    </section>

    <section>
        <h2>createElement (viewers tick up every 2 s)</h2>
        <pap-codeblock display="both">
            <div class="list" id="created"></div>
        </pap-codeblock>
    </section>
</body>

</html>
