<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FileCard | experiment</title>

    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <!-- Styles -->
    <link rel="stylesheet" href="style.css" />

    <script defer type="module" src="main.js"></script>
</head>

<body>
    <h1>FileCard | experiment</h1>

    <section>
        <h2>Other: sending, receiving, indeterminate, done (text, image, audio), cancelled, failed, long name, HTML-looking name</h2>
        <div class="stack" data-set="other"></div>
    </section>

    <section>
        <h2>Mine</h2>
        <div class="stack" data-set="mine"></div>
    </section>

    <section>
        <h2>createElement</h2>
        <div class="stack" id="created"></div>
        <p id="log">cancel events: none</p>
    </section>

    <section data-theme="dark">
        <h2>Dark</h2>
        <div class="stack" data-set="other"></div>
        <div class="stack" data-set="mine"></div>
    </section>
</body>

</html>
