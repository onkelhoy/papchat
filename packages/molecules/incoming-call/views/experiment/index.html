<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pc-incoming-call | experiment</title>
    <link rel="stylesheet" href="style.css" />
    <script defer type="module" src="main.js"></script>
</head>

<body>
    <h1>pc-incoming-call</h1>

    <section>
        <h2>Kinds</h2>
        <div class="row">
            <pc-incoming-call id="call"></pc-incoming-call>
            <pc-incoming-call id="video"></pc-incoming-call>
            <pc-incoming-call id="stage"></pc-incoming-call>
            <pc-incoming-call id="chat"></pc-incoming-call>
        </div>
        <p id="log">events: -</p>
    </section>

    <section>
        <h2>createElement</h2>
        <div class="row" id="created"></div>
    </section>

    <section data-theme="dark">
        <h2>Dark</h2>
        <div class="row">
            <pc-incoming-call id="dark"></pc-incoming-call>
        </div>
    </section>
</body>

</html>
