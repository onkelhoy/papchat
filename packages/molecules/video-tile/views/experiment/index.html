<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pc-video-tile | experiment</title>
    <link rel="stylesheet" href="style.css" />
    <script defer type="module" src="main.js"></script>
</head>

<body>
    <h1>pc-video-tile</h1>

    <section>
        <h2>Audio</h2>
        <p>Start the oscillator to drive the level meters and the speaking ring of every tile with audio.</p>
        <pap-codeblock display="both">
            <button id="tone" type="button">Start tone</button>
        </pap-codeblock>
    </section>

    <section>
        <h2>States</h2>
        <pap-codeblock display="both">
            <div class="row">
                <pc-video-tile class="demo" data-name="Anna Berg" data-video data-audio></pc-video-tile>
                <pc-video-tile class="demo" data-name="Bob Lind" data-audio></pc-video-tile>
                <pc-video-tile class="demo" data-name="Cleo Dahl" data-video muted></pc-video-tile>
                <pc-video-tile class="demo" data-name="Dan Ek" muted></pc-video-tile>
            </div>
        </pap-codeblock>
    </section>

    <section>
        <h2>Self (mirrored) / screen (contain) / pinned</h2>
        <pap-codeblock display="both">
            <div class="row">
                <pc-video-tile class="demo" data-name="Me Myself" data-video data-audio self></pc-video-tile>
                <pc-video-tile class="demo" data-name="Anna Berg" data-video data-screen screen></pc-video-tile>
                <pc-video-tile class="demo" data-name="Eva Fors" data-video data-audio pinned></pc-video-tile>
            </div>
        </pap-codeblock>
    </section>

    <section>
        <h2>Long name</h2>
        <pap-codeblock display="both">
            <div class="row">
                <pc-video-tile class="demo" data-name="Maximilian Alexander von Hohenzollern-Sigmaringen" data-audio></pc-video-tile>
            </div>
        </pap-codeblock>
    </section>

    <section>
        <h2>createElement</h2>
        <pap-codeblock display="both">
            <div class="row" id="created"></div>
            <p id="log">events: none</p>
        </pap-codeblock>
    </section>
</body>

</html>
