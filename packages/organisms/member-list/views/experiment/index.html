<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pc-member-list | experiment</title>
    <link rel="stylesheet" href="style.css" />
    <script defer type="module" src="main.js"></script>
</head>

<body>
    <h1>pc-member-list</h1>
    <p class="hint">Icons need <code>/icons/spritesheet.svg</code> (served by the app page). Arrow keys move between rows; search filters by name.</p>
    <p id="log" class="hint">member-action events show here</p>

    <section>
        <h2>Full list (me, in a call, canInvite, status sorting)</h2>
        <pap-codeblock display="both">
            <div class="box"><pc-member-list id="full" caninvite></pc-member-list></div>
        </pap-codeblock>
    </section>

    <section>
        <h2>Empty</h2>
        <pap-codeblock display="both">
            <div class="box"><pc-member-list id="empty"></pc-member-list></div>
        </pap-codeblock>
    </section>

    <section>
        <h2>createElement, live updates (a member joins every 3 s)</h2>
        <pap-codeblock display="both">
            <div class="box" id="created"></div>
        </pap-codeblock>
    </section>
</body>

</html>
