<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pc-settings | experiment</title>
    <link rel="stylesheet" href="style.css" />
    <script defer type="module" src="main.js"></script>
</head>

<body>
    <h1>pc-settings</h1>
    <p id="log" class="hint">events show here</p>

    <section>
        <h2>Light / dark / createElement</h2>
        <button id="open-light" type="button">Open (declarative)</button>
        <button id="open-dark" type="button">Open (dark)</button>
        <button id="open-created" type="button">Open (createElement)</button>
        <pc-settings id="light"></pc-settings>
        <div data-theme="dark"><pc-settings id="dark"></pc-settings></div>
    </section>
</body>

</html>
