<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pc-app-header | experiment</title>
    <link rel="stylesheet" href="style.css" />
    <script defer type="module" src="main.js"></script>
</head>

<body>
    <h1>pc-app-header</h1>
    <p id="log">events show here</p>

    <section>
        <h2>Connected, available</h2>
        <pap-codeblock display="both">
            <pc-app-header data-me status="connected"></pc-app-header>
        </pap-codeblock>
    </section>

    <section>
        <h2>Waking, Swedish selected</h2>
        <pap-codeblock display="both">
            <pc-app-header data-me status="waking" language="sv"></pc-app-header>
        </pap-codeblock>
    </section>

    <section>
        <h2>Live (presenting), idle status</h2>
        <pap-codeblock display="both">
            <pc-app-header data-me status="idle" live></pc-app-header>
        </pap-codeblock>
    </section>

    <section>
        <h2>No profile, closed</h2>
        <pap-codeblock display="both">
            <pc-app-header status="closed"></pc-app-header>
        </pap-codeblock>
    </section>

    <section>
        <h2>createElement</h2>
        <pap-codeblock display="both">
            <div id="created"></div>
        </pap-codeblock>
    </section>
</body>

</html>
