<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pc-room | experiment</title>
    <link rel="stylesheet" href="style.css" />
    <script defer type="module" src="main.js"></script>
</head>

<body>
    <h1>pc-room</h1>

    <section>
        <h2>Not in a call / in a call / viewer</h2>
        <pap-codeblock display="both">
            <div class="row">
                <pc-room class="demo" id="idle"></pc-room>
                <pc-room class="demo" id="call" incall></pc-room>
                <pc-room class="demo" id="viewer" incall viewer></pc-room>
            </div>
        </pap-codeblock>
    </section>

    <section>
        <h2>createElement</h2>
        <pap-codeblock display="both">
            <div class="row" id="created"></div>
        </pap-codeblock>
    </section>
</body>

</html>
