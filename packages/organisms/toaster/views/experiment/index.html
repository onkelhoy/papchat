<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pc-toaster | experiment</title>
    <link rel="stylesheet" href="style.css" />
    <script defer type="module" src="main.js"></script>
</head>

<body>
    <h1>pc-toaster</h1>

    <section>
        <h2>Stack (dismiss removes it; the action toast calls onAction in the page)</h2>
        <pap-codeblock display="both">
            <div class="row"><button id="add" type="button">Add toast (4 s)</button><span id="log">events: -</span></div>
            <div class="frame"><pc-toaster></pc-toaster></div>
        </pap-codeblock>
    </section>

    <section>
        <h2>More than 4 (only the newest 4 show)</h2>
        <pap-codeblock display="both">
            <div class="frame"><pc-toaster></pc-toaster></div>
        </pap-codeblock>
    </section>

    <section>
        <h2>createElement</h2>
        <pap-codeblock display="both">
            <div class="frame" id="created"></div>
        </pap-codeblock>
    </section>
</body>

</html>
