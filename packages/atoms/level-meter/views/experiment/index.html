<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pc-level-meter | experiment</title>
    <link rel="stylesheet" href="style.css" />
    <script defer type="module" src="main.js"></script>
</head>

<body>
    <h1>pc-level-meter</h1>

    <section>
        <h2>Test signal</h2>
        <p>A tone is generated in the page (no microphone needed). Browsers need a click before audio can start.</p>
        <div class="row">
            <button id="toggle" type="button">Start test signal</button>
            <span id="speaking">speaking: false</span>
        </div>
    </section>

    <section>
        <h2>Bars</h2>
        <div class="row">
            <pc-level-meter class="demo" bars="3"></pc-level-meter>
            <pc-level-meter class="demo"></pc-level-meter>
            <pc-level-meter class="demo" bars="8"></pc-level-meter>
            <pc-level-meter class="demo big" bars="12"></pc-level-meter>
        </div>
    </section>

    <section>
        <h2>No stream (idle)</h2>
        <div class="row">
            <pc-level-meter></pc-level-meter>
        </div>
    </section>

    <section>
        <h2>createElement</h2>
        <div class="row" id="created"></div>
    </section>

    <section data-theme="dark">
        <h2>Dark</h2>
        <div class="row">
            <pc-level-meter class="demo"></pc-level-meter>
            <pc-level-meter class="demo big" bars="8"></pc-level-meter>
        </div>
    </section>
</body>

</html>
