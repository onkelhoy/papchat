<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>papchat</title>
    <meta name="description" content="Peer-to-peer chat, calls and screen sharing in the browser.">
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="main.ts"></script>
</head>

<body>
    <pc-app-shell>
        <pc-app-header slot="header"></pc-app-header>
        <div slot="sidebar" class="sidebar">
            <pc-room-list></pc-room-list>
            <pc-member-list></pc-member-list>
        </div>
        <main slot="main" class="main">
            <pc-room hidden></pc-room>
            <p class="empty"></p>
        </main>
        <div slot="overlay" class="incoming"></div>
        <pc-toaster slot="toasts"></pc-toaster>
    </pc-app-shell>
    <pc-onboarding></pc-onboarding>
    <pc-invite-picker></pc-invite-picker>
    <pc-settings></pc-settings>
</body>

</html>
