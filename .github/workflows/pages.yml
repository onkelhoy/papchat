name: pages

on:
  push:
    branches: [main]
    # notes and docs aren't a release
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.versions.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          CI: true
        run: npm run build -- --ci --remote

      - name: Static site
        working-directory: packages/pages/app
        run: npx @papit/static -- --base /${{ github.event.repository.name }}/ --info

      - name: Version log
        id: versions
        run: |
          git fetch --unshallow --tags
          node bin/version-log.mjs packages/pages/app/dist/version.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/pages/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # only what went live gets a version
      - name: Tag the release
        if: needs.build.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/${{ needs.build.outputs.tag }}" -f sha="${{ github.sha }}"
